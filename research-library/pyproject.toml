[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-research-library"
version = "0.1.0"
description = "A file-backed, agent-independent reading archive"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5", "httpx>=0.28,<1", "jsonschema>=4.23,<5", "pypdf>=5,<7"]

[project.scripts]
library = "research_library.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/research_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
